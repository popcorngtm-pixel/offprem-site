name: Weekly Roundup

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-roundup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch and build roundup data
        run: python3 scripts/fetch_roundup.py

      - name: Commit updated data files
        run: |
          git config user.name "offprem-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/roundup.json data/ticker.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Weekly roundup: $(date -u +'%Y-%m-%d')"
          git push
